[package]
name = "approvals"
version = "0.1.0"
edition = "2021"
description = "Two-approval root, policy co-signer, break-glass — docs/APPROVALS-SPEC.md as code. No I/O, no network."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
