[package]
name = "org-chart"
version = "0.1.0"
edition = "2021"
description = "Org chart as the sole grant authority: positions, roles, clearance attributes compile to capabilities. No code changes between a deep hierarchy and a lone key — only the chart file differs."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

