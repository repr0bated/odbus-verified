locale = "en"
schema_version = 3

[a2a.server]
enabled = true

[skill_bundles.default]
directory = "shared/skills/default"

[gateway]
host = "127.0.0.1"
port = 8084
require_pairing = true
allow_public_bind = false
allow_remote_admin = false
request_timeout_secs = 30
long_running_request_timeout_secs = 600

# Local OpenCode session transport. The daemon injects the root-owned server
# password at startup; no upstream provider credential is stored here.
[providers.models.custom.opencode_dashboard]
model = "opencode/nemotron-3-ultra-free"
uri = "http://127.0.0.1:4096"
wire_api = "chat_completions"
native_tools = false
provider_extra = { opdbus_transport = "opencode_session" }

[providers.models.custom.opencode_accountability]
model = "opencode/nemotron-3-ultra-free"
uri = "http://127.0.0.1:4096"
wire_api = "chat_completions"
native_tools = false
provider_extra = { opdbus_transport = "opencode_session" }

[providers.models.custom.opencode_control_plane]
model = "opencode/nemotron-3-ultra-free"
uri = "http://127.0.0.1:4096"
wire_api = "chat_completions"
native_tools = false
provider_extra = { opdbus_transport = "opencode_session" }

[providers.models.custom.opencode_cp_route_grok_47]
model = "xai/grok-4.7"
uri = "http://127.0.0.1:4096"
wire_api = "chat_completions"
native_tools = false
provider_extra = { opdbus_transport = "opencode_session" }

[providers.models.custom.opencode_cp_route_nemotron_3_ultra]
model = "opencode/nemotron-3-ultra-free"
uri = "http://127.0.0.1:4096"
wire_api = "chat_completions"
native_tools = false
provider_extra = { opdbus_transport = "opencode_session" }

[providers.models.custom.opencode_cp_route_deepseek_v41_flash]
model = "opencode/deepseek-v4.1-flash"
uri = "http://127.0.0.1:4096"
wire_api = "chat_completions"
native_tools = false
provider_extra = { opdbus_transport = "opencode_session" }

[providers.models.custom.opencode_cp_route_glm_53_flash]
model = "opencode/glm-5.3-flash"
uri = "http://127.0.0.1:4096"
wire_api = "chat_completions"
native_tools = false
provider_extra = { opdbus_transport = "opencode_session" }

[providers.models.custom.opencode_cp_route_qwen3_coder_flash]
model = "qwen/qwen3-coder-flash"
uri = "http://127.0.0.1:4096"
wire_api = "chat_completions"
native_tools = false
provider_extra = { opdbus_transport = "opencode_session" }

[providers.models.custom.opencode_cp_route_gpt6_astra]
model = "openai/gpt-6-astra"
uri = "http://127.0.0.1:4096"
wire_api = "chat_completions"
native_tools = false
provider_extra = { opdbus_transport = "opencode_session" }

[providers.models.custom.opencode_cp_route_claude_fable_51]
model = "anthropic/claude-fable-5-1"
uri = "http://127.0.0.1:4096"
wire_api = "chat_completions"
native_tools = false
provider_extra = { opdbus_transport = "opencode_session" }

[agents.dashboard]
enabled = true
model_provider = "custom.opencode_dashboard"
risk_profile = "dashboard"
skill_bundles = ["default"]

[agents.control_plane]
enabled = true
model_provider = "custom.opencode_control_plane"
risk_profile = "control_plane"
skill_bundles = ["default"]

[agents.control_plane.a2a]
published = true
exposed_skills = ["plugin-schema"]

[agents.control_plane.memory]
backend = "none"

[agents.accountability]
enabled = true
model_provider = "custom.opencode_accountability"
risk_profile = "accountability"
skill_bundles = ["default"]

[agents.accountability.a2a]
published = true
exposed_skills = ["plugin-schema"]

[agents.accountability.memory]
backend = "none"

[agents.dashboard.a2a]
published = true
exposed_skills = [
    "plugin-schema",
    "ovs-network-triage",
    "qdrant-collections",
    "mutation-dispatch",
]

[risk_profiles.dashboard]
level = "readonly"
workspace_only = true
require_approval_for_medium_risk = true
block_high_risk_commands = true

[risk_profiles.control_plane]
level = "readonly"
workspace_only = true
require_approval_for_medium_risk = true
block_high_risk_commands = true

[risk_profiles.accountability]
level = "readonly"
workspace_only = true
require_approval_for_medium_risk = true
block_high_risk_commands = true

# Do not fold the open-skills corpus (40 SKILL.md files, ~90k tokens) into every
# agent turn; it alone exceeded the model context budget and made each chat turn
# take 10-300s.
[skills]
open_skills_enabled = false

