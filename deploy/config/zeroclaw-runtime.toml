locale = "en"
schema_version = 3

# Named agents read their runtime profile, not the legacy [agent] setting.
[runtime_profiles.chatbot_500]
max_tool_iterations = 500

[a2a.server]
enabled = true

[skill_bundles.default]
directory = "shared/skills/default"

[gateway]
host = "127.0.0.1"
port = 8084
require_pairing = true
allow_public_bind = false
allow_remote_admin = false
request_timeout_secs = 30
long_running_request_timeout_secs = 600

# OpenCode Zen, the same kind of upstream as Anthropic or OpenRouter.
# The daemon injects /etc/op-dbus/secrets/opencode-api-key at startup.
# Model ids are the Zen catalog ids. Chat-completions models use that wire;
# Responses-API models (Grok, GPT) set wire_api = "responses".
# Claude Fable and Qwen 3.8 are Messages-API models. They use the Anthropic
# client, which posts to `{uri}/v1/messages` with `x-api-key`. Zen's base is
# `https://opencode.ai/zen`, so the request URL is `https://opencode.ai/zen/v1/messages`.
[providers.models.custom.opencode_dashboard]
model = "nemotron-3-ultra-free"
uri = "https://opencode.ai/zen/v1"
wire_api = "chat_completions"
native_tools = false

[providers.models.custom.opencode_accountability]
model = "glm-5.3-flash"
uri = "https://opencode.ai/zen/v1"
wire_api = "chat_completions"
native_tools = false

[providers.models.custom.opencode_control_plane]
model = "glm-5.3-flash"
uri = "https://opencode.ai/zen/v1"
wire_api = "chat_completions"
native_tools = false

[providers.models.custom.opencode_cp_route_grok_47]
model = "grok-4.7"
uri = "https://opencode.ai/zen/v1"
wire_api = "responses"
native_tools = false

[providers.models.custom.opencode_cp_route_nemotron_3_ultra]
model = "nemotron-3-ultra-free"
uri = "https://opencode.ai/zen/v1"
wire_api = "chat_completions"
native_tools = false

[providers.models.custom.opencode_cp_route_deepseek_v41_flash]
model = "deepseek-v4.1-flash"
uri = "https://opencode.ai/zen/v1"
wire_api = "chat_completions"
native_tools = false

[providers.models.custom.opencode_cp_route_glm_53_flash]
model = "glm-5.3-flash"
uri = "https://opencode.ai/zen/v1"
wire_api = "chat_completions"
native_tools = false

[providers.models.anthropic.zen_qwen38_flash]
model = "qwen3.8-flash"
uri = "https://opencode.ai/zen"

[providers.models.custom.opencode_cp_route_gpt6_astra]
model = "gpt-6-astra"
uri = "https://opencode.ai/zen/v1"
wire_api = "responses"
native_tools = false

[providers.models.anthropic.zen_claude_fable_51]
model = "claude-fable-5-1"
uri = "https://opencode.ai/zen"

[agents.dashboard]
runtime_profile = "chatbot_500"
enabled = true
model_provider = "custom.opencode_dashboard"
risk_profile = "dashboard"
skill_bundles = ["default"]

[agents.control_plane]
runtime_profile = "chatbot_500"
enabled = true
model_provider = "custom.opencode_control_plane"
risk_profile = "control_plane"
skill_bundles = ["default"]

[agents.control_plane.a2a]
published = true
exposed_skills = ["plugin-schema"]

[agents.control_plane.memory]
backend = "none"

[agents.accountability]
runtime_profile = "chatbot_500"
enabled = true
model_provider = "custom.opencode_accountability"
risk_profile = "accountability"
skill_bundles = ["default"]

[agents.accountability.a2a]
published = true
exposed_skills = ["plugin-schema"]

[agents.accountability.memory]
backend = "none"

[agents.dashboard.a2a]
published = true
exposed_skills = [
    "plugin-schema",
    "ovs-network-triage",
    "qdrant-collections",
    "mutation-dispatch",
]

[risk_profiles.dashboard]
level = "readonly"
workspace_only = true
require_approval_for_medium_risk = true
block_high_risk_commands = true

[risk_profiles.control_plane]
level = "readonly"
workspace_only = true
require_approval_for_medium_risk = true
block_high_risk_commands = true

[risk_profiles.accountability]
level = "readonly"
workspace_only = true
require_approval_for_medium_risk = true
block_high_risk_commands = true

# Do not fold the open-skills corpus (40 SKILL.md files, ~90k tokens) into every
# agent turn; it alone exceeded the model context budget and made each chat turn
# take 10-300s.
[skills]
open_skills_enabled = false

