# 3tched network configuration — canonical boot topology
# Staged into the golden subvolume by deploy/runit/build-golden.sh.
#
# Boot order (2026-10 rebuild — collapses the old multi-service race):
#   opdbus-rundirs -> uplink-dhcp -> ovsdb-server -> ovs-vswitchd
#   (ovs-vswitchd/run itself runs `op-ovsbr0-setup --seed-only` before
#   exec'ing the daemon: bridge + uplink + pub0 created in ONE OVSDB
#   transaction, no second step, no boot race)
#   -> ovsbr0-cutover (moves the DHCP lease from eth0 to pub0, applies the
#   bridge's own MQTT alias)
#
# ovsbr0 owns only the MQTT alias (10.0.0.3). There is no "3tched" internal
# port, no door/page aliases, and no tun port of any kind on this bridge.
# All application traffic (door, page, decoy/Xray leg, everything that used
# to need its own bridge-level address) now goes through container socket
# relays (xsock-*/uds-*) and the single Tonic/gRPC endpoint on :8090 — it
# never touches ovsbr0 at the IP layer. Do not reintroduce per-service bridge
# addresses for that traffic; if it needs its own address again, that's a
# regression, not a feature.
#
# OpenFlow is NOT active. op-of-controller does not run and OVS has no
# controller configured. These OF_* values are reserved for future tag-based
# routing and must stay inert until that work actually starts — do not wire
# OPENFLOW_CONTROLLER into anything.

BRIDGE=ovsbr0
FAIL_MODE=standalone
DATAPATH_TYPE=system
OVSDB_SOCKET=/run/openvswitch/db.sock
VSWITCHD_SVC=ovs-vswitchd

UPLINK_PHYS=eth0
UPLINK=

PUBLIC_PORT=pub0
PUBLIC_ADDR=188.68.58.237/22
PUBLIC_GW=188.68.56.1

INTERNAL_PORTS=
BRIDGE_SVC_ADDRS="10.0.0.3/32@ovsbr0"

# Reserved for future tag-based routing — inert, nothing binds these today.
# OF_CONTROLLER_LISTEN=10.200.0.1:6653
# OF_CONTROLLER_TLS_CA=/etc/op-dbus/openflow/client-ca.crt
# OF_CONTROLLER_TLS_CERT=/etc/op-dbus/openflow/controller.crt
# OF_CONTROLLER_TLS_KEY=/etc/op-dbus/openflow/controller.key
# OPENFLOW_CONTROLLER=ssl:10.200.0.1:6653
# OF_PROTOCOLS=OpenFlow10,OpenFlow13,OpenFlow15
# OF_STATIC_FLOWS_FILE=/etc/op-dbus/openflow-static-flows.json
# OF_FLOW_PAIRS=
# OF_STATIC_FDB=ovsbr0:eth0:0:00:00:5e:00:01:0a

BRIDGE_MTU=1420
# IDENTITY_HOST: the admin's own device as a decoy WireGuard peer, not a
# bridge concern. Expected to drift as the admin reconnects from elsewhere.
IDENTITY_HOST=10.0.0.9
