# 3tched network configuration — canonical boot topology
# Staged into the golden subvolume by deploy/lib/golden/build-golden.sh.
#
# Boot order (2026-10 rebuild — collapses the old multi-service race):
#   opdbus-rundirs -> uplink-dhcp -> ovsdb-server -> ovs-vswitchd
#   (ovs-vswitchd/run itself runs `op-ovsbr0-setup --seed-only` before
#   exec'ing the daemon: bridge + uplink + pub0 created in ONE OVSDB
#   transaction, no second step, no boot race)
#   -> ovsbr0-cutover (moves the DHCP lease from eth0 to pub0, applies the
#   bridge's own MQTT alias)
#
# ovsbr0 has exactly three service aliases and no per-service interfaces:
# EMQX, OpenFlow, and host Qdrant. Only the EMQX number is assigned.
# OpenFlow and host Qdrant numbers are unset; do not invent them and do not
# reuse 10.200.0.0/24. Tonic 10.0.0.2 belongs on rtly-lungs, not on ovsbr0.
# There is no svc0 port. Door and page traffic use the shared lungs socket.
#
# OpenFlow is NOT active. op-of-controller does not run and OVS has no
# controller configured. Do not wire a controller until its address is assigned.

BRIDGE=ovsbr0
FAIL_MODE=standalone
DATAPATH_TYPE=system
OVSDB_SOCKET=/run/openvswitch/db.sock
VSWITCHD_SVC=ovs-vswitchd

UPLINK_PHYS=eth0
UPLINK=

PUBLIC_PORT=pub0
PUBLIC_ADDR=188.68.58.237/22
PUBLIC_GW=188.68.56.1

INTERNAL_PORTS=
BRIDGE_SVC_ADDRS="10.0.0.3/32@ovsbr0"

# OpenFlow and host Qdrant alias numbers are unset. Nothing binds them.

BRIDGE_MTU=1420
# IDENTITY_HOST: the admin's own device as a decoy WireGuard peer, not a
# bridge concern. Expected to drift as the admin reconnects from elsewhere.
IDENTITY_HOST=10.0.0.9
