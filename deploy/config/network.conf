# 3tched network configuration — canonical boot topology
# Staged into the golden subvolume by deploy/runit/build-golden.sh.
#
# Boot order:
#   opdbus-rundirs -> uplink-dhcp -> ovsdb-server -> ovs-vswitchd
#   -> ovsbr0-uplink -> ovsbr0-tun5 -> ovsbr0-eth0 -> ovsbr0-svc-addr
#   -> op-of-controller
#   (op-warp-ssh-host brings up tun5; ovsbr0-tun5 enslaves it in OVSDB)
#
# 3tched owns only the internal service alias (10.200.0.2). ovsbr0 owns
# internal OpenFlow (10.200.0.1) and the MQTT alias (10.0.0.3).
# After the verified SSH-TUN cutover, tun5 owns the door (10.0.0.2:8090),
# page alias (10.0.0.4:8080), and former GRE transport address as aliases.
# Their transport release inputs own those addresses; OVS must not recreate
# duplicates. This file is release preparation, not an applied cutover.
# svc0 and grpc0 are retired address carriers.

BRIDGE=ovsbr0
OVS_TUN_PORT=tun5
OVS_TUN_TRANSPORT_SERVICE=op-warp-ssh-host
FAIL_MODE=standalone
DATAPATH_TYPE=system
OVSDB_SOCKET=/run/openvswitch/db.sock
VSWITCHD_SVC=ovs-vswitchd

UPLINK_PHYS=eth0
UPLINK=

PUBLIC_PORT=pub0
PUBLIC_ADDR=188.68.58.237/22
PUBLIC_GW=188.68.56.1

INTERNAL_PORTS="3tched"
BRIDGE_ADDR=10.200.0.1/24
BRIDGE_SVC_ADDRS="10.200.0.2/24@3tched 10.0.0.3/32@ovsbr0"

OF_CONTROLLER_LISTEN=10.200.0.1:6653
# Provision the controller's TLS server identity and a CA that signs only
# authorized OVS switch client certificates before starting op-of-controller.
# Configure OVS's own certificate/key/CA with `ovs-vsctl set-ssl` separately.
# OF_CONTROLLER_TLS_CA=/etc/op-dbus/openflow/client-ca.pem
# OF_CONTROLLER_TLS_CERT=/etc/op-dbus/openflow/controller.pem
# OF_CONTROLLER_TLS_KEY=/etc/op-dbus/openflow/controller-key.pem
OPENFLOW_CONTROLLER=ssl:10.200.0.1:6653
OF_PROTOCOLS=OpenFlow10,OpenFlow13,OpenFlow15
OF_STATIC_FLOWS_FILE=/etc/op-dbus/openflow-static-flows.json
OF_FLOW_PAIRS=
# Preserve the flooding fix: the upstream VRRP MAC is pinned to eth0.
OF_STATIC_FDB=ovsbr0:eth0:0:00:00:5e:00:01:0a

BRIDGE_MTU=1420
IDENTITY_HOST=10.0.0.5
