# runtime dirs the 3tchedfs units need (mirrors deploy/provisioning/runit/core-services/90-opdbus.sh:5-6)
d /run/mounts 0755 root root -
d /run/mounts/3tchedFS 0755 root root -
d /run/mounts/threetched 0755 root root -
d /dev/shm/opdbus/state 0755 root root -
# op-grpc-bridge Runtime::open requires its durable identity owner dir (runtime.rs IDENTITY_SLED_COZO_DB_PATH)
d /var/lib/op-dbus/identity-cozo 0700 root root -
