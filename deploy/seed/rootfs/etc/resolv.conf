# Container DNS goes to the local NextDNS client (nextdns.service), whose
# profile and device are the NextDNS context sealed in this identity (NDN1).
# Fallback is the NIC-less BPF egress stub (host loader on 127.0.0.2:53,
# ct-egress-bpf-<instance>): TCP connect() is BPF-redirected and dialed
# directly by the host, so NextDNS DoH and every other TCP flow need no
# NIC, no Xray/socat proxy and no proxy environment.
nameserver 127.0.0.1
nameserver 127.0.0.2
options edns0
