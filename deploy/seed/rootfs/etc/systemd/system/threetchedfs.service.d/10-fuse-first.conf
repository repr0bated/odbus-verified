# Jeremy 2026-11-21: the FUSE comes up first; every other call goes through it.
[Unit]
DefaultDependencies=no
Wants=systemd-tmpfiles-setup.service
After=systemd-tmpfiles-setup.service local-fs.target
Before=sysinit.target shutdown.target
Conflicts=shutdown.target

[Service]
# checks from deploy/provisioning/runit/threetchedfs/run:6-7, plus /dev/fuse, before the repo's capture
ExecStartPre=
ExecStartPre=/usr/bin/test -c /dev/fuse
ExecStartPre=/usr/bin/test -r /dev/shm/opdbus/plugin-blobs/.manifest.json
ExecStartPre=/usr/bin/test -S /run/opdbus/lungs/lungs.sock
ExecStartPre=/usr/bin/install -d -m 0755 /run/mounts/threetched
ExecStartPre=/usr/local/libexec/op-dbus/bin/3tched-fs capture --store /run/3tchedfs-threetched --schema-only --catalog /dev/shm/opdbus/plugin-blobs --state /dev/shm/opdbus/state --include-plugin threetched
# "started" only once the FUSE is actually mounted
ExecStartPost=/bin/sh -c 'i=0; while [ $i -lt 300 ]; do mountpoint -q /run/mounts/threetched && exit 0; i=$((i+1)); sleep 0.1; done; exit 1'
