# Prometheus on antix1 (runit sv: prometheus). Listens 127.0.0.1:9090, 30d retention.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    host: antix1

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
        labels: {instance: antix1}

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels: {instance: antix1}

  - job_name: grafana
    static_configs:
      - targets: ['100.96.0.5:3000']
        labels: {instance: antix1}

  # Incus /1.0/metrics over the existing HTTPS listener, authenticated with a
  # metrics-only trust certificate (incus config trust ... --type=metrics).
  - job_name: incus
    scheme: https
    metrics_path: /1.0/metrics
    scrape_interval: 60s
    static_configs:
      - targets: ['100.96.0.5:8443']
        labels: {instance: antix1}
    tls_config:
      cert_file: /etc/prometheus/tls/incus-metrics.crt
      key_file: /etc/prometheus/tls/incus-metrics.key
      ca_file: /etc/prometheus/tls/incus-server.crt
      server_name: 3tched
