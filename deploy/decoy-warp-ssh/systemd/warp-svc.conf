[Unit]
Requires=op-warp-prepare.service
Wants=op-warp-ssh.service
After=op-warp-prepare.service

[Service]
NetworkNamespacePath=/run/netns/op-warp
PrivateMounts=yes
BindReadOnlyPaths=/etc/netns/op-warp/resolv.conf:/etc/resolv.conf
InaccessiblePaths=-/run/dbus/system_bus_socket -/run/systemd/resolve/io.systemd.Resolve -/run/systemd/resolve/io.systemd.Resolve.Monitor
