## Standalone local broker owned by OP-DBUS, not Netmaker.
## This file is the immutable deployment layer; runtime API writes land under
## /var/lib/emqx/configs. All broker listeners are private loopback backends.

node {
  name = "emqx@127.0.0.1"
  data_dir = "/var/lib/emqx"
}

cluster {
  name = opdbus
  discovery_strategy = manual
}

listeners.tcp.default {
  bind = "127.0.0.1:1883"
  enable_authn = true
  proxy_protocol = false
  max_connections = 1024
}

## Port zero allocates an ephemeral listener in EMQX; disable explicitly.
listeners.ssl.default { enable = false, bind = "127.0.0.1:8883" }
listeners.ws.default { enable = false, bind = "127.0.0.1:8083" }
listeners.wss.default { enable = false, bind = "127.0.0.1:8084" }
listeners.quic.default { enable = false, bind = "127.0.0.1:14567" }

## Content-free knowledge wakes. ExHook authenticates the identity sled and
## permits each client to subscribe only to its own opdbus/wake/<owner-key>.
## Actual knowledge is read through the authenticated :8090 plugin door.
listeners.wss.wake {
  enable = true
  bind = "127.0.0.1:8085"
  enable_authn = true
  max_connections = 1024
  websocket.mqtt_path = "/mqtt"
  ssl_options {
    cacertfile = "/etc/emqx/certs/opdbus-ca.crt"
    certfile = "/etc/emqx/certs/doorbell-server.crt"
    keyfile = "/etc/emqx/certs/doorbell-server.key"
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

dashboard {
  cors = false
  listeners.http.bind = "127.0.0.1:18083"
  listeners.https.bind = 0
}

authentication = [
  {
    enable = true
    backend = built_in_database
    mechanism = password_based
    user_id_type = username
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
    bootstrap_file = "/var/lib/emqx/bootstrap/auth-built-in-db-bootstrap.csv"
    bootstrap_type = plain
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = file
      enable = true
      path = "/usr/share/op-dbus/emqx-etc/acl.conf"
    }
  ]
}

## The plugin talks to the management API with this locally generated key;
## dashboard credentials are never reused as machine credentials.
api_key.bootstrap_file = "/var/lib/emqx/bootstrap/api-keys.txt"
