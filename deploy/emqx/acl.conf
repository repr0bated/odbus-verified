%% The generated local publisher uses the broker's static authorization.
{allow, {username, "opdbus"}, all, ["#", "$SYS/#"]}.
%% Leave other requests unmatched so the lower-priority ExHook can enforce
%% the identity sled and exact owner topic. A terminal deny here would stop
%% the hook chain before ExHook. authorization.no_match = deny remains the
%% final default, including when ExHook is unavailable or ignores a request.
