# Applied at boot by ovsbr0-persist after openvswitch-switch restores conf.db.
# pub0 owns the public address.
PUB_ADDR=188.68.58.237/22
PUB_GW=188.68.56.1
# ovsbr0 carries OpenFlow 10.200.0.1. 10.0.0.3 stays only until EMQX moves
# behind 8090: the current release's bridge waits for it and EMQX listens on it.
BRIDGE_ALIASES="10.0.0.3/32 10.200.0.1/24"
# The door address on its own interface. WARP traffic comes to .2;
# op-grpc-bridge (8090) and op-web (8080) bind it.
DOOR_IF=warp0
DOOR_IF_KIND=tun
DOOR_ADDRS="10.0.0.2/32"
# Point-to-point peer: the decoy. Host traffic for .1 enters warp0.
DOOR_PEER=10.0.0.1/32
# pub0:8090 -> 10.0.0.2:8090, for traffic arriving over the decoy's WARP tunnel.
DOOR_NFT=/etc/op-dbus/door.nft
