<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Private, opt-in bus that carries only the read-only org.freedesktop.systemd1
     compat responder. NOT the system bus. Clients opt in by setting
     DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/systemd1-compat/system_bus_socket.
     Socket access is gated by /run/systemd1-compat (root-only 0700 by default;
     see /etc/systemd1-compat/socket-group). -->
<busconfig>
  <type>systemd1-compat</type>
  <listen>unix:path=/run/systemd1-compat/system_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <deny own="*"/>
    <deny send_type="method_call"/>
    <allow send_destination="org.freedesktop.DBus"/>
    <allow send_type="signal"/>
    <allow send_requested_reply="true" send_type="method_return"/>
    <allow send_requested_reply="true" send_type="error"/>
    <allow receive_type="method_call"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
    <allow receive_type="signal"/>
  </policy>
  <policy user="root">
    <allow own="org.freedesktop.systemd1"/>
    <allow send_destination="org.freedesktop.systemd1"/>
  </policy>
  <!-- Extra grants, e.g. <policy group="foo"><allow send_destination="org.freedesktop.systemd1"/></policy> -->
  <includedir>/etc/systemd1-compat/bus.d</includedir>
  <limit name="max_completed_connections">64</limit>
  <limit name="max_connections_per_user">32</limit>
</busconfig>
