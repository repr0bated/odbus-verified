# journal-compat: one JSON object per line for /usr/local/libexec/journal-compat/bin/journalctl
# (opt-in journalctl emulation for programs such as Huntress Rio on this journald-less host).
template(name="JournalCompatJson" type="list" option.jsonf="on") {
  property(outname="ts" name="timereported" dateFormat="rfc3339" format="jsonf")
  property(outname="host" name="hostname" format="jsonf")
  property(outname="ident" name="programname" format="jsonf")
  property(outname="pid" name="procid" format="jsonf")
  property(outname="pri" name="syslogseverity" format="jsonf")
  property(outname="fac" name="syslogfacility" format="jsonf")
  property(outname="msg" name="msg" format="jsonf")
}
*.* action(type="omfile" file="/var/log/journal-compat/journal.json" template="JournalCompatJson"
           dirCreateMode="0700" fileCreateMode="0600")
