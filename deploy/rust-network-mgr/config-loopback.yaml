interfaces:
  # Identity containers intentionally have no NIC. Loopback gives the manager
  # a stable netlink subject without inventing an eth0 device.
  - name: lo
    dhcp: false

# Shared bridge-owned lungs socket. rust-network-mgr must not bind or replace it.
socket_path: /run/opdbus/lungs/lungs.sock
http_bind_addr: 127.0.0.1:9100
