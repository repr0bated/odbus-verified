[package]
name = "op-chat-interface"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Identity-bound chat interface backend (Rust). Browser UI is Svelte/TypeScript and lives with the dashboard; everything server-side is here."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
jsonschema = { workspace = true }
sha2 = { workspace = true }
# Chat_Route binary (src/bin/chat-route.rs): gRPC server.
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true }
tonic-web = { workspace = true }
tokio-stream = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
# Chat_Link protobuf + generated ChatService trait (single source of truth).
op-chat = { path = "../op-chat" }
