[package]
name = "op-mcp-door"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "TLS-only MCP Streamable HTTP endpoint on the door; every tool call is a 3tchedFS call-file write"

[lib]
name = "op_mcp_door"

[[bin]]
name = "op-mcp-door"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.21"
libc = "0.2"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.29", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
tower = { version = "0.5", features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
ed25519-dalek = "2.2"
# OIA1 wire codec and signature check. Not the bridge.
op-identity = { path = "../op-identity" }

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"
http-body-util = "0.1"
