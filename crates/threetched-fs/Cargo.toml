[package]
name = "threetched-fs"
version = "0.1.0"
edition.workspace = true
description = "Schema-driven FUSE projection over authoritative typed OP-DBUS blobs"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fuser = { version = "0.16", default-features = false, features = ["abi-7-31"] }
fs2 = "0.4"
jsonschema = { version = "0.29", default-features = false }
libc = "0.2"
parking_lot = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", features = ["tokio"] }
# The sealed schema's authority: it decodes every blob this crate projects.
op-state-store = { workspace = true }

[dev-dependencies]
tempfile = "3"
