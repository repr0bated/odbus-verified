[package]
name = "op-cozo-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
crc32c = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
nix = { version = "0.28", features = ["fs", "user"] }
anyhow = { workspace = true }
chrono = { workspace = true }
cozo = { workspace = true }
# Same pinned cozorocks that cozo 0.7.6 links; used directly for the raw
# ublk chunk keyspace (get / put / write batch, synced WAL barrier).
cozorocks = "=0.1.7"
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
schemars = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
zstd = { workspace = true }
op-identity = { path = "../op-identity" }

[[bin]]
name = "identity-sled-bind"
path = "src/bin/identity_sled_bind.rs"

[[bin]]
name = "list-genesis"
path = "src/bin/list-genesis.rs"

[[bin]]
name = "sled-row"
path = "src/bin/sled-row.rs"

[[bin]]
name = "ublk-block-store"
path = "src/bin/ublk-block-store.rs"

[dev-dependencies]
tempfile = { workspace = true }
