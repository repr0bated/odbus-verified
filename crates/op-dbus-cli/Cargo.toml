[package]
name = "op-dbus-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI tool for introspecting the org.opdbus.v1.plugins D-Bus tree"

[[bin]]
name = "dbus-plugin-cli"
path = "src/main.rs"

# Operator CLI over the mounted 3tchedFS namespace: every plugin, method and
# argument flag comes from that live mirror of the sealed blobs, as does completion.
[[bin]]
name = "zcall"
path = "src/bin/zcall/main.rs"

[dependencies]
# zcall calls methods only through the identity's mounted 3tchedFS namespace.
_3tched-fs = { path = "../_3tched-fs" }
libc = { workspace = true }
reqwest = { workspace = true }
op-core = { workspace = true }
op-identity = { path = "../op-identity" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }
quick-xml = { workspace = true }
hex = "0.4"
