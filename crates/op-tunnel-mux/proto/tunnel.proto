syntax = "proto3";

package operation.tunnel.v1;

// Inbound door for the container that owns it. Identity is the Unix peer
// credential, never a field in these messages. TLS for the door ends in the
// container. Inbound only: container egress is ct-egress, not this service.
service Tunnel {
  // Bridge-originated connection spliced to the container door.
  // The server sends Target first. The client sends only bytes.
  rpc Accept(stream Frame) returns (stream Frame);
}

message Frame {
  oneof payload {
    Target target = 1;
    bytes data = 2;
  }
}

message Target {
  string host = 1;
  uint32 port = 2;
}
