[package]
name = "op-chat-responder"
version = "1.0.0"
edition = "2024"
description = "Out-of-band chat responder service for OP-DBUS chatbot"

[[bin]]
name = "op-chat-responder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = "4"
